version: '3'

tasks:

  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  build:
    desc: Build the csl-pattern CLI
    cmds:
      - go build -o csl-pattern .

  run:
    desc: List patterns from email.csl
    cmds:
      - go run . -file email.csl -list

  generate-email:
    desc: Generate a CSL definition from email.regex
    cmds:
      - go run . -regex-file email.regex -name EmailAddress > generated-email.csl

  benchmark:
    desc: Compare match strategies across pattern structures and input cases
    silent: true
    cmds:
      - |
        output_file="$(mktemp)"
        trap 'rm -f "$output_file"' EXIT
        if ! go test -run '^$' -bench '^(BenchmarkPatternMatching|BenchmarkSchemaRegexPipeline)$' -benchtime="${BENCHTIME:-100ms}" -benchmem ./... >"$output_file"; then
          cat "$output_file"
          exit 1
        fi
        awk '
          BEGIN {
            printf "%-24s %-7s %8s %11s %10s %10s\n", "Pattern", "Engine", "N", "Time", "Bytes/op", "Allocs/op"
            printf "%-24s %-7s %8s %11s %10s %10s\n", "-------", "------", "-", "----", "--------", "---------"
          }
          /^BenchmarkPatternMatching\// {
            split($1, parts, "/")
            sub(/-[0-9]+$/, "", parts[3])
            time = bytes = allocations = active = checks = closure = hits = misses = "-"
            for (i = 3; i <= NF; i++) {
              if ($i == "ns/op" || $i == "us/op" || $i == "µs/op" || $i == "ms/op" || $i == "s/op") time = $(i-1) " " $i
              if ($i == "B/op" || $i == "kB/op" || $i == "MB/op") bytes = $(i-1)
              if ($i == "allocs/op") allocations = $(i-1)
              if ($i == "cold-active/op") active = $(i-1)
              if ($i == "cold-checks/op") checks = $(i-1)
              if ($i == "cold-closure/op") closure = $(i-1)
              if ($i == "cold-hits/op") hits = $(i-1)
              if ($i == "cold-misses/op") misses = $(i-1)
            }
            printf "%-24s %-7s %8s %11s %10s %10s\n", parts[3], parts[2], $2, time, bytes, allocations
            if (parts[2] == "NFA") {
              nfaCount++
              nfaPatterns[nfaCount] = parts[3]
              nfaActive[nfaCount] = active
              nfaChecks[nfaCount] = checks
              nfaClosure[nfaCount] = closure
              nfaHits[nfaCount] = hits
              nfaMisses[nfaCount] = misses
            }
          }
          END {
            if (nfaCount > 0) {
              printf "\n%s\n", "NFA cold work (instrumented single run)"
              printf "%-36s %8s %8s %8s %8s %8s\n", "Pattern", "Active", "Checks", "Closure", "Hits", "Misses"
              for (i = 1; i <= nfaCount; i++) {
                printf "%-36s %8s %8s %8s %8s %8s\n", nfaPatterns[i], nfaActive[i], nfaChecks[i], nfaClosure[i], nfaHits[i], nfaMisses[i]
              }
            }
          }
        ' "$output_file"

        awk '
          BEGIN {
            printf "\n%s\n", "Schema regex pipeline"
            printf "%-24s %-16s %8s %11s %10s %10s\n", "Pattern", "Stage", "N", "Time", "Bytes/op", "Allocs/op"
            printf "%-24s %-16s %8s %11s %10s %10s\n", "-------", "-----", "-", "----", "--------", "---------"
          }
          /^BenchmarkSchemaRegexPipeline\// {
            split($1, parts, "/")
            sub(/-[0-9]+$/, "", parts[3])
            time = bytes = allocations = "-"
            for (i = 4; i <= NF; i++) {
              if ($i == "ns/op" || $i == "us/op" || $i == "µs/op" || $i == "ms/op" || $i == "s/op") time = $(i-1) " " $i
              if ($i == "B/op" || $i == "kB/op" || $i == "MB/op") bytes = $(i-1)
              if ($i == "allocs/op") allocations = $(i-1)
            }
            printf "%-24s %-16s %8s %11s %10s %10s\n", parts[2], parts[3], $2, time, bytes, allocations
          }
        ' "$output_file"

  format:
    desc: Format Go files and check whitespace style
    preconditions:
      - sh: command -v gocondense >/dev/null 2>&1
        msg: |
             gocondense is required for the format task but was not found on PATH
             go install github.com/abemedia/gocondense/cmd/gocondense@latest
      - sh: command -v wsl >/dev/null 2>&1
        msg: |
            wsl is required for the format task but was not found on PATH
            go install github.com/bombsimon/wsl/v5/cmd/wsl@latest
    cmds:
      - gocondense ./...
      - wsl -fix ./...
